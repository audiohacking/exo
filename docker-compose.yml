services:
  exo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: exo:cuda13
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Exo data directory (includes models subdirectory)
      - ~/.local/share/exo:/root/.local/share/exo
      # Exo cache (logs, temporary files)
      - ~/.cache/exo:/root/.cache/exo
      # Exo config — NOT mounted to avoid sharing the Mac's keypair/identity.
      # The container generates its own node ID in /root/.config/exo/.
      # HuggingFace cache (model downloads)
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      # Cluster namespace — must match the Mac node
      - EXO_ZENOH_NAMESPACE=qxip-cluster
      # - EXO_LIBP2P_NAMESPACE=qxip
      # Required for the /v1/instance-links API (prefill/decode disaggregation).
      # Without this, all instance-link endpoints 404. Must also be set on the Mac node.
      - ENABLE_DISAGGREGATION=true
      # Streams each layer's KV cache out as it's computed instead of waiting for the
      # whole prefill to finish. Only affects prefill-server instances (Instance Links).
      - EXO_STREAMING_PREFILL=1
    stdin_open: true
    tty: true
